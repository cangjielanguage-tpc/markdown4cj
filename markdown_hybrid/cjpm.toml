[target]
  [target.aarch64-linux-ohos]
    compile-option = "-lace_napi.z -B \"${DEVECO_CANGJIE_HOME}/compiler/third_party/llvm/bin\" -B \"${DEVECO_OH_NATIVE_HOME}/sysroot/usr/lib/aarch64-linux-ohos\" -L \"${DEVECO_OH_NATIVE_HOME}/sysroot/usr/lib/aarch64-linux-ohos\" -L \"${DEVECO_OH_NATIVE_HOME}/llvm/lib/clang/15.0.4/lib/aarch64-linux-ohos\" -L \"${DEVECO_OH_NATIVE_HOME}/llvm/lib/aarch64-linux-ohos\" -L \"${DEVECO_CANGJIE_HOME}/build/linux_ohos_aarch64_llvm/openssl\" --sysroot \"${DEVECO_OH_NATIVE_HOME}/sysroot\""
    [target.aarch64-linux-ohos.bin-dependencies]
      path-option = [ "${AARCH64_LIBS}", "${AARCH64_MACRO_LIBS}", "${AARCH64_KIT_LIBS}", "${CANGJIE_STDX_PATH}/linux_ohos_aarch64_cjnative/dynamic/stdx" ]
      [target.aarch64-linux-ohos.bin-dependencies.package-option]
  [target.x86_64-linux-ohos]
    compile-option = "-lace_napi.z -B \"${DEVECO_CANGJIE_HOME}/compiler/third_party/llvm/bin\" -B \"${DEVECO_OH_NATIVE_HOME}/sysroot/usr/lib/x86_64-linux-ohos\" -L \"${DEVECO_OH_NATIVE_HOME}/sysroot/usr/lib/x86_64-linux-ohos\" -L \"${DEVECO_OH_NATIVE_HOME}/llvm/lib/clang/15.0.4/lib/x86_64-linux-ohos\" -L \"${DEVECO_OH_NATIVE_HOME}/llvm/lib/x86_64-linux-ohos\" -L \"${DEVECO_CANGJIE_HOME}/build/linux_ohos_x86_64_llvm/openssl\" --sysroot \"${DEVECO_OH_NATIVE_HOME}/sysroot\""
    [target.x86_64-linux-ohos.bin-dependencies]
      path-option = [ "${X86_64_OHOS_LIBS}", "${X86_64_OHOS_MACRO_LIBS}", "${X86_64_OHOS_KIT_LIBS}", "../stdx_bin/linux_ohos_x86_64_llvm/static/stdx" ]
  [target.x86_64-unknown-windows-gnu]
    [target.x86_64-unknown-windows-gnu.bin-dependencies]
      path-option = [ "${X86_64_LIBS}", "${X86_64_MACRO_LIBS}" ]
      [target.x86_64-unknown-windows-gnu.bin-dependencies.package-option]

[dependencies]
  [dependencies.commonmark4cj]
    tag = "v1.1.1"
    git = "https://gitcode.com/Cangjie-TPC/commonmark4cj.git"
  [dependencies.prism4cj]
    tag = "v1.0.4"
    git = "https://gitcode.com/Cangjie-TPC/prism4cj.git"
  [dependencies.formula]
    tag = "v1.5.1"
    git = "https://gitcode.com/Cangjie-TPC/formula-ffi.git"
  [dependencies.codeformat]
    tag = "v1.0.0"
    git = "https://gitcode.com/Cangjie-TPC/codeformat4cj.git"

[ffi]
  [ffi.c]
    [ffi.c.text_to_img]
      path = "./libs/${ABI}"

[package]
  cjc-version = "0.48.2"
  compile-option = "--dy-std --disable-reflection"
  description = "CangjieUI Application"
  link-option = ""
  name = "markdown"
  output-type = "dynamic"
  src-dir = "./src/main/cangjie"
  target-dir = ""
  version = "1.0.0"
  [package.package-configuration]
  [package.package-configuration.markdown]
    output-type = "dynamic"
    compile-option = "--compile-as-exe"
    combine-all-deps = true
  [package.scripts]

[profile]
  [profile.build]
    incremental = true
    lto = "full"
    combined={markdown = "dynamic"}
  [profile.customized-option]
    debug = "-g -Woff all -Won apilevel-check"
    release = "--fast-math -O2 -s -Woff all -Won apilevel-check"
  [profile.test]
