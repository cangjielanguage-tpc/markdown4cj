[target]
  [target.aarch64-linux-ohos]
    compile-option = "-B \"${DEVECO_CANGJIE_HOME}/compiler/third_party/llvm/bin\" -B \"${DEVECO_CANGJIE_HOME}/musl/usr/lib/aarch64-linux-ohos\" -L \"${DEVECO_CANGJIE_HOME}/musl/usr/lib/aarch64-linux-ohos\" -L \"${DEVECO_CANGJIE_HOME}/build/linux_ohos_aarch64_llvm/openssl\" --sysroot \"${DEVECO_CANGJIE_HOME}/musl\""
    [target.aarch64-linux-ohos.bin-dependencies]
      path-option = [ "${AARCH64_LIBS}", "${AARCH64_MACRO_LIBS}", "${AARCH64_TPC_LIBS}" ]
      [target.aarch64-linux-ohos.bin-dependencies.package-option]

[dependencies]
  [dependencies.cj_res_markdown]
    path = "./cj_res"
    version = "1.0.0"
  [dependencies.commonmark4cj]
    tag = "ds_inline"
    git = "https://gitcode.com/Cangjie-TPC/commonmark4cj.git"
  [dependencies.prism4cj]
    tag = "cjc_0.53.13"
    git = "https://gitcode.com/Cangjie-TPC/prism4cj.git"
  [dependencies.formula]
    tag = "cjc_0.53.13"
    git = "https://gitcode.com/Cangjie-TPC/formula-ffi.git"
  [dependencies.texttoimg4cj]
    path = "../../../../library/src/main/cangjie"

[package]
  cjc-version = "0.53.18"
  compile-option = ""
  description = "Markdown"
  link-option = ""
  name = "markdown"
  output-type = "dynamic"
  src-dir = "src"
  target-dir = ""
  version = "1.0.0"
  [package.package-configuration]
  [package.scripts]

[profile]
  [profile.build]
    incremental = true
    lto = ""
  [profile.customized-option]
    debug = "-g -Woff all"
    release = "--fast-math -O2 -Woff all"
  [profile.test]
